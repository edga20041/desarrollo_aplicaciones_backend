<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="reset-password.css"> </head>
<body>
    <div class="container">
        <h1>Restablecer Contraseña</h1>
        <form id="resetForm">
            <input type="hidden" id="token" name="token">
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña:</label>
                <input type="password" id="newPassword" name="newPassword" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit">Guardar Nueva Contraseña</button>
            <div id="message"></div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            document.getElementById('token').value = token;

            const resetForm = document.getElementById('resetForm');
            const messageDiv = document.getElementById('message');

            resetForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const token = document.getElementById('token').value;

                if (newPassword !== confirmPassword) {
                    messageDiv.textContent = "Las contraseñas no coinciden.";
                    messageDiv.className = "";
                    return;
                }

                fetch('http://localhost:8081/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ token: token, newPassword: newPassword }),
                })
                .then(response => {
                    const isOk = response.ok;
                    return response.json()
                        .then(data => ({ ok: isOk, data: data }));
                })
                .then(result => {
                    if (result.ok) {
                        messageDiv.textContent = "Contraseña restablecida correctamente.";
                        messageDiv.className = "success";
                        // Opcionalmente, redirigir después de un breve tiempo
                        // setTimeout(() => { window.location.href = '/login'; }, 1500);
                    } else {
                        messageDiv.textContent = result.data.message || "Error al restablecer la contraseña.";
                        messageDiv.className = "";
                    }
                })
                .catch(error => {
                    messageDiv.textContent = "Error de conexión.";
                    messageDiv.className = "";
                    console.error("Error de conexión:", error);
                });
            });
        });
    </script>
</body>
</html>
